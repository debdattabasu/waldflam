[package]
name = "waldflam-rsconf"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
firestore = "0.50"
gcloud-sdk = { version = "0.30", default-features = false, features = ["google-firestore-v1"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
