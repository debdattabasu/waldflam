[workspace]
resolver = "3"
members = [
    "crates/waldflam-proto",
    "crates/waldflam-engine",
    "crates/waldflam-rules",
    "crates/waldflam-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/debdattabasu/waldflam"

# RSA key generation is dominated by bignum arithmetic, which is unusably
# slow unoptimized — tens of seconds per key, paid by every `cargo test` that
# creates a credential. Optimizing just that crate keeps debug builds honest
# about our own code while making key generation take a moment instead of a
# coffee break.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[workspace.dependencies]
waldflam-proto = { path = "crates/waldflam-proto" }
waldflam-engine = { path = "crates/waldflam-engine" }
waldflam-rules = { path = "crates/waldflam-rules" }

tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
mongodb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
